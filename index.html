<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMOD LABS | العتاد الأنيق</title>
  <meta name="description" content="HAMOD LABS: معرض لابتوبات وورك ستيشن وجيمنج وموبايلات بأسعار مصر وتصميم بسيط ومنظم.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg-dark:#0a0d14;--bg-card:#131b2e;--primary-cyan:#00f2fe;--neon-pink:#ff007f;--text-main:#fff;--text-muted:#8a99ad;--border-color:rgba(255,255,255,.08)}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
    body{background-color:var(--bg-dark);color:var(--text-main);overflow-x:hidden}
    
    nav{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 8%;background:rgba(10,13,20,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border-color)}
    .logo{font-size:1.8rem;font-weight:900;color:var(--primary-cyan);display:flex;align-items:center;gap:10px}
    .nav-links{display:flex;gap:2rem;list-style:none}
    .nav-links a{color:var(--text-muted);text-decoration:none;font-weight:700;transition:.3s}
    .nav-links a:hover{color:var(--primary-cyan)}

    .hero{text-align:center;padding:5rem 2rem 3rem;max-width:800px;margin:0 auto}
    .hero h1{font-size:3rem;font-weight:900;margin-bottom:1rem;color:#fff}
    .hero p{font-size:1.15rem;color:var(--text-muted);line-height:1.7}

    .budget-section{max-width:800px;margin:1rem auto 3rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:1.5rem 2rem}
    .budget-box{display:flex;gap:12px;margin-top:1rem;flex-wrap:wrap}
    .budget-box select,.budget-box input{flex:1;min-width:180px;padding:12px 16px;background:#0f1523;border:1px solid var(--border-color);border-radius:10px;color:#fff;font-size:1rem;outline:none}
    .budget-box button{padding:12px 24px;background:var(--primary-cyan);color:#000;font-weight:bold;border:none;border-radius:10px;cursor:pointer;transition:.3s}
    .budget-box button:hover{opacity:.9}

    .search-filter-container{max-width:900px;margin:0 auto 2.5rem;padding:0 1rem}
    .search-bar{position:relative;margin-bottom:1.5rem}
    .search-bar input{width:100%;padding:14px 20px 14px 50px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:30px;color:#fff;font-size:1rem;outline:none}
    .search-bar i{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
    .filter-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .filter-btn{padding:8px 20px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;color:var(--text-muted);cursor:pointer;font-weight:700;transition:.3s}
    .filter-btn.active,.filter-btn:hover{background:var(--primary-cyan);border-color:var(--primary-cyan);color:#000}

    .products-section{padding:0 8% 5rem}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem}
    .card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;padding:1.5rem;display:flex;flex-direction:column;justify-content:space-between;transition:.3s}
    .card:hover{border-color:var(--primary-cyan);transform:translateY(-5px)}
    .product-img-box{width:100%;height:180px;background:#0a0d14;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;overflow:hidden}
    .product-img{width:100%;height:100%;object-fit:contain;padding:10px}
    .card-title{font-size:1.2rem;font-weight:800;margin-bottom:.5rem}
    .specs-list{list-style:none;color:var(--text-muted);font-size:0.88rem;margin-bottom:1.2rem}
    .specs-list li{margin-bottom:.4rem}
    .card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-color);padding-top:1rem}
    .price{font-size:1.3rem;font-weight:900;color:var(--primary-cyan)}
    .btn-amazon{background:#ff9900;color:#000;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:0.9rem;display:flex;align-items:center;gap:6px}

    .toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--primary-cyan);color:#000;padding:10px 25px;border-radius:20px;font-weight:bold;transition:.3s;z-index:9999}
    .toast.show{transform:translateX(-50%) translateY(0)}

    @media(max-width:768px){.nav-links{display:none}.hero h1{font-size:2.2rem}}
  </style>
</head>
<body>

  <div id="toast" class="toast">تم الإجراء بنجاح</div>

  <nav>
    <div class="logo"><i class="fa-solid fa-atom"></i> HAMOD LABS</div>
    <ul class="nav-links">
      <li><a href="#">الرئيسية</a></li>
      <li><a href="#products">العتاد</a></li>
      <li><a href="#budget">حاسبة الميزانية</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>منصة العتاد والأجهزة الرقمية</h1>
    <p>تصفح أحدث اللابتوبات، الورك ستيشن، والموبايلات بأسعار السوق المصري بتصميم بسيط ومنظم وسهل التصفح.</p>
  </section>

  <section class="budget-section" id="budget">
    <h3 style="color:#fff;font-size:1.2rem"><i class="fa-solid fa-calculator" style="color:var(--primary-cyan)"></i> حاسبة الميزانية السريعة</h3>
    <div class="budget-box">
      <select id="budgetCategory">
        <option value="all">كل الفئات</option>
        <option value="workstation">Workstations</option>
        <option value="gaming">Gaming</option>
        <option value="phone">موبايلات</option>
        <option value="accessory">أكسسوارات</option>
      </select>
      <input type="number" id="maxBudget" placeholder="الميزانية القصوى (بالجنيه)">
      <button onclick="filterByBudget()">فلترة النتائج</button>
    </div>
  </section>

  <div class="search-filter-container">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="ابحث عن جهاز أو ملحق...">
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterData('all',this)">الكل</button>
      <button class="filter-btn" onclick="filterData('workstation',this)">Workstations</button>
      <button class="filter-btn" onclick="filterData('gaming',this)">Gaming</button>
      <button class="filter-btn" onclick="filterData('phone',this)">موبايلات</button>
      <button class="filter-btn" onclick="filterData('accessory',this)">أكسسوارات</button>
    </div>
  </div>

  <section class="products-section" id="products">
    <div class="products-grid" id="grid"></div>
  </section>

  <script>
    const AFFILIATE_TAG = 'mohamed0650-21';
    const products = [];

    function add(category, title, price, specs, q) {
      let cleanPrice = parseInt(price.replace(/[^0-9]/g, '')) || 0;
      products.push({
        id: products.length + 1, title, category, price, cleanPrice, specs,
        amazonUrl: 'https://www.amazon.eg/s?k=' + encodeURIComponent(q || title) + '&tag=' + AFFILIATE_TAG
      });
    }

    add("workstation","Dell Precision 5520","17,500 ج.م",["Intel i7-7820HQ", "32GB RAM", "512GB SSD", "Quadro M1200"],"Dell Precision 5520");
    add("workstation","HP EliteBook 840 G6","25,950 ج.م",["Intel i7-8665U", "16GB RAM", "256GB SSD"],"HP EliteBook 840 G6");
    add("workstation","Apple MacBook Pro M2 Max","85,000 ج.م",["M2 Max Chip", "32GB RAM", "1TB SSD"],"MacBook Pro M2 Max");
    add("gaming","Lenovo Legion 5 Pro","34,500 ج.م",["Ryzen 7 5800H", "16GB RAM", "RTX 3060"],"Lenovo Legion 5");
    add("gaming","ASUS ROG Strix G15","38,000 ج.م",["Ryzen 9 5900HX", "16GB RAM", "RTX 3070"],"ASUS ROG Strix G15");
    add("phone","Samsung Galaxy S23 Ultra","48,000 ج.م",["Snapdragon 8 Gen 2", "12GB RAM", "256GB"],"Samsung Galaxy S23 Ultra");
    add("phone","iPhone 14 Pro Max","62,000 ج.م",["A16 Bionic", "6GB RAM", "256GB"],"iPhone 14 Pro Max");
    add("accessory","ماوس جيمنج Logitech G102","650 ج.م",["8000 DPI", "RGB Lighting"],"Logitech G102");
    add("accessory","هارد SSD خارجي Samsung T7 1TB","3,600 ج.م",["1050MB/s", "USB 3.2"],"Samsung T7 1TB");

    let currentCat = 'all';

    function renderProducts(items) {
      const grid = document.getElementById('grid');
      if (!items.length) { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:2rem">لا توجد نتائج مطابقة</div>'; return; }
      grid.innerHTML = items.map(p => `
        <div class="card">
          <div>
            <div class="product-img-box">
              <i class="fa-solid fa-laptop" style="font-size:3rem;color:var(--primary-cyan)"></i>
            </div>
            <h3 class="card-title">${p.title}</h3>
            <ul class="specs-list">${p.specs.map(s => `<li>• ${s}</li>`).join('')}</ul>
          </div>
          <div class="card-footer">
            <span class="price">${p.price}</span>
            <a href="${p.amazonUrl}" target="_blank" rel="noopener" class="btn-amazon"><i class="fa-brands fa-amazon"></i> شراء</a>
          </div>
        </div>
      `).join('');
    }

    function applyFilter() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      renderProducts(products.filter(p => 
        (currentCat === 'all' || p.category === currentCat) &&
        (p.title.toLowerCase().includes(q) || p.specs.join(' ').toLowerCase().includes(q))
      ));
    }

    function filterData(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter();
    }

    function searchProducts() { applyFilter(); }

    function filterByBudget() {
      const max = parseInt(document.getElementById('maxBudget').value);
      if (isNaN(max) || max <= 0) { showToast("أدخل ميزانية صحيحة"); return; }
      const matched = products.filter(p => p.cleanPrice <= max);
      renderProducts(matched);
      showToast(`تم عرض ${matched.length} جهاز يناسب ميزانيتك`);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    renderProducts(products);
  </script>
</body>
</html>
